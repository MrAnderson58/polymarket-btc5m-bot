# PostgreSQL 17 for trading_ai (Market Events + futures_agent share this database).
# Usage:
#   cd deploy/docker
#   cp .env.example .env   # set POSTGRES_PASSWORD
#   docker compose up -d
#   docker compose --profile adminer up -d   # optional Adminer UI on :8080

services:
  postgres:
    image: postgres:17
    container_name: trading_ai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-trading_ai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - trading_ai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading} -d ${POSTGRES_DB:-trading_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  adminer:
    image: adminer:4
    container_name: trading_ai_adminer
    restart: unless-stopped
    profiles:
      - adminer
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  trading_ai_pgdata:
    name: trading_ai_pgdata
